<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23f5cf7a'/%3E%3Cstop offset='55%25' stop-color='%235ce3d4'/%3E%3Cstop offset='100%25' stop-color='%231b6e8c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%230a1a32'/%3E%3Cpath d='M22.5 11.2a8.2 8.2 0 1 0 0 9.6' fill='none' stroke='url(%23g)' stroke-width='4.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>A C of Possibilities — Procedural Ocean</title>
  </head>
  <body data-sea-state="golden">
    <canvas
      id="ocean-canvas"
      aria-label="Interactive procedural ocean of shifting typographic C glyphs and sea-glass breakers"
    ></canvas>

    <header class="sea-caption">
      <p class="sea-headline">
        A
        <span class="pun-slot" id="pun-slot">
          <span class="pun-word pun-word-sea" id="pun-sea">sea</span>
          <span class="pun-word pun-word-c" aria-hidden="true">C</span>
        </span>
        of possibilities.
      </p>
    </header>

    <div class="dock-wrap">
      <nav class="control-dock" aria-label="Ocean state and interaction controls">
        <button class="dock-btn is-active" type="button" data-state="golden" aria-pressed="true">
          Golden Swell
        </button>
        <button class="dock-btn" type="button" data-state="storm" aria-pressed="false">
          Abyssal Storm
        </button>
        <button class="dock-btn" type="button" data-state="biolum" aria-pressed="false">
          Bioluminescent
        </button>
        <span class="dock-divider" aria-hidden="true"></span>
        <button
          class="dock-btn dock-tool-btn"
          id="tool-toggle"
          type="button"
          data-tool="wake"
          aria-pressed="false"
          title="Switch left-drag between Wake and Orbit (right-drag and scroll always orbit and zoom)"
        >
          <span class="tool-dot" aria-hidden="true"></span>
          <span class="tool-label" id="tool-label">Wake</span>
        </button>
      </nav>
    </div>

    <script type="module" src="/src/side/sea-of-c/main.ts"></script>
  </body>
</html>
